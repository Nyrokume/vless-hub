    type: subscription
    enabled: true
    url: https://raw.githubusercontent.com/Argh94/Proxy-List/main/MTProto.txt

  # Generic SOCKS5, not Telegram. The tunnel opens and then drops the MTProto handshake.
  - name: argh94-socks5
    kind: telegram-proxy
    type: subscription
    enabled: false
    limit: 80
    url: https://raw.githubusercontent.com/Argh94/Proxy-List/main/SOCKS5.txt

