# kind: telegram-proxy — публичные MTProto (tg://proxy, t.me/proxy, секреты ee/dd)
# и SOCKS5 (tg://socks, t.me/socks, socks5://). type как у VLESS: subscription или telegram.
# limit — сколько ссылок брать из этого источника (0 = max_tg_links_per_source).

  - name: tgmtproxy
    kind: telegram-proxy
    type: subscription
    enabled: true
    url: https://raw.githubusercontent.com/tgmtproxy/telegram-mtproto-proxy-list/main/proxies.txt

  - name: soli-mtproto
    kind: telegram-proxy
    type: subscription
    enabled: true
    url: https://raw.githubusercontent.com/SoliSpirit/mtproto/master/all_proxies.txt

  - name: argh94-mtproto
    kind: telegram-proxy
    type: subscription
    enabled: true
    url: https://raw.githubusercontent.com/Argh94/Proxy-List/main/MTProto.txt

  - name: argh94-socks5
    kind: telegram-proxy
    type: subscription
    enabled: true
    limit: 80
    url: https://raw.githubusercontent.com/Argh94/Proxy-List/main/SOCKS5.txt

  - name: tg-proxymtproto
    kind: telegram-proxy
    type: telegram
    enabled: true
    channel: ProxyMTProto

  - name: tg-proxy-pub
    kind: telegram-proxy
    type: telegram
    enabled: true
    channel: proxy_pub

  - name: tg-mtpro-xyz
    kind: telegram-proxy
    type: telegram
    enabled: true
    channel: mtpro_xyz
