# Публичные источники VLESS, Shadowsocks, Trojan и Hysteria2.
# Добавить источник: скопируйте блок, задайте уникальный name и url/channel.
# type: subscription — сырой файл или base64-подписка (определяется автоматически)
# type: telegram — веб-превью https://t.me/s/<channel>, без API и токена
# enabled: false — выключить, не удаляя запись
# Источник с нулевым выходом два прогона подряд отодвигается в конец очереди.
# Три прогона без живых ссылок или без рабочих конфигов ставят источник на паузу.

settings:
  drop_after_failures: 4
  max_links_per_source: 15000
  # TCP is only a prefilter. A config is published only after this run's
  # handshake, 2 of 3 HTTPS checks, a throughput floor, and a different exit IP.
  # A definitive HTTP answer is not retried. The whole check stays inside 20s.
  max_tcp_tests: 20000
  max_proxy_tests: 12000
  tcp_timeout_sec: 2.5
  proxy_timeout_sec: 6.0
  speed_timeout_sec: 0
  tcp_concurrency: 200
  proxy_concurrency: 12
  proxy_batch_size: 24
  fetch_timeout_sec: 30
  fetch_concurrency: 6
  max_bytes_per_source: 8000000
  telegram_pages: 3
  top_sizes: [20, 50, 100]
  clash_limit: 0
  # Telegram MTProto / SOCKS. The check is a real handshake (resPQ), not a TCP ping.
  # 6000 targets at 64 workers is about 13 minutes if every probe uses the full timeout.
  max_tg_tests: 6000
  tg_timeout_sec: 8
  tg_concurrency: 64
  max_tg_links_per_source: 2000
  tg_top_sizes: [20, 50]
  user_agent: "vless-hub/1.0 (+https://github.com/Nyrokume/vless-hub)"
  # Two extra full passes after the first. A config is published only if every pass succeeds.
  confirm_rounds: 2
  # If fewer than this pass, previously working configs are retested before the list is replaced.
  min_working: 40
  # check-host.net TCP from Russia. A completed refusal is not published.
  # Addresses the scan does not finish stay in the list. 0 disables the scan.
  vantage_checks: 800
  vantage_budget_sec: 240

