name: Collect

on:
  schedule:
    # Every 6 hours. The run probes public endpoints, so keep the cadence modest.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parser tests
        working-directory: collector
        run: python3 -m unittest discover -s . -p 'test_*.py'

      - name: Install Xray
        run: |
          set -euo pipefail
          version="v26.3.27"
          sha="23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
          mkdir -p collector/bin
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${version}/Xray-linux-64.zip"
          echo "${sha}  /tmp/xray.zip" | sha256sum -c -
          unzip -o /tmp/xray.zip -d collector/bin
          chmod +x collector/bin/xray
          collector/bin/xray version

      - name: Collect and probe
        run: python3 collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update collected VLESS configs"
            git push
          fi
