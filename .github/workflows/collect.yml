name: Collect

on:
  schedule:
    # Every 6 hours. The run probes public endpoints, so keep the cadence modest.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parser tests
        working-directory: collector
        run: python3 -m unittest test_vlesslib.py

      - name: Collect and probe
        run: python3 collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update collected VLESS configs"
            git push
          fi
